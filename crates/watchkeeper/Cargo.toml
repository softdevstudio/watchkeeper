[package]
name = "watchkeeper"
description = "A tiny browser that shows you who's watching."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "watchkeeper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
watchkeeper-core = { path = "../watchkeeper-core" }
# "unstable" enables several webviews in one window (page, toolbar, panel).
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Same GTK as Tauri, used to lay out the webviews on Linux.
gtk = "0.18"
