[package]
name = "watchkeeper"
description = "A tiny browser that shows you who's watching."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "watchkeeper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
watchkeeper-core = { path = "../watchkeeper-core" }
# "unstable" enables several webviews in one window (page, toolbar, panel).
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Same GTK as Tauri, used to lay out the webviews on Linux.
gtk = "0.18"
# The page's webview handle, for native back and forward (the page cannot
# intercept these the way it can replace history.back()).
webkit2gtk = "2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", features = ["std", "objc2-app-kit", "WKWebView", "WKNavigation"] }
