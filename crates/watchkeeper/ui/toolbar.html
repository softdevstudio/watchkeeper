<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Watchkeeper toolbar</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div class="toolbar">
    <button id="back" title="Back" aria-label="Back">&#8592;</button>
    <button id="forward" title="Forward" aria-label="Forward">&#8594;</button>
    <button id="reload" title="Reload" aria-label="Reload">&#8635;</button>
    <form id="go">
      <input id="address" type="text" spellcheck="false" autocomplete="off"
             placeholder="Type a web address" aria-label="Web address">
    </form>
    <span id="error" class="error"></span>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
