[workspace]
resolver = "2"
members = ["crates/watchkeeper-core", "crates/watchkeeper"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/softdevstudio/watchkeeper"
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
